<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    /* Theme Variables */
    :root {
      --bg-gradient: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #020617);
      --card-bg: rgba(30, 41, 59, 0.6);
      --card-hover: rgba(51, 65, 85, 0.8);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
    }

    [data-theme="cyberpunk"] {
      --bg-gradient: linear-gradient(-45deg, #050515, #1a0b2e, #2b0036, #001220);
      --card-bg: rgba(20, 10, 35, 0.7);
      --card-hover: rgba(45, 15, 75, 0.85);
      --text-main: #00ffcc;
      --text-muted: #ff007f;
      --accent: #ff007f;
      --accent-glow: rgba(255, 0, 127, 0.5);
    }

    [data-theme="emerald"] {
      --bg-gradient: linear-gradient(-45deg, #022c22, #064e3b, #02383c, #011c16);
      --card-bg: rgba(6, 78, 59, 0.5);
      --card-hover: rgba(4, 120, 87, 0.7);
      --text-main: #ecfdf5;
      --text-muted: #6ee7b7;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.5);
    }

    [data-theme="sunset"] {
      --bg-gradient: linear-gradient(-45deg, #4c1d95, #831843, #881337, #2e1065);
      --card-bg: rgba(88, 28, 135, 0.5);
      --card-hover: rgba(126, 34, 206, 0.7);
      --text-main: #fff1f2;
      --text-muted: #f472b6;
      --accent: #fb7185;
      --accent-glow: rgba(251, 113, 133, 0.5);
    }

    [data-theme="dracula"] {
      --bg-gradient: linear-gradient(-45deg, #282a36, #44475a, #191a21, #343746);
      --card-bg: rgba(68, 71, 90, 0.6);
      --card-hover: rgba(98, 114, 164, 0.7);
      --text-main: #f8f8f2;
      --text-muted: #bd93f9;
      --accent: #ff79c6;
      --accent-glow: rgba(255, 121, 198, 0.5);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(-45deg, #f1f5f9, #e2e8f0, #cbd5e1, #f8fafc);
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-hover: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Top Navigation Bar */
    .top-bar {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      right: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }

    /* Weather Widget Dropdown Container */
    .weather-container {
      position: relative;
    }

    .weather-widget {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 99px;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }

    .weather-widget:hover {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .weather-icon {
      font-size: 1.2rem;
    }

    /* Animated Weather Card Overlay */
    .weather-card-menu {
      position: absolute;
      left: 0;
      top: 100%;
      padding-top: 10px;
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-12px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .weather-card-menu.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .weather-app-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(24px);
      border-radius: 20px;
      padding: 1.25rem;
      width: 320px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* City Search Input inside Weather Card */
    .city-search-form {
      display: flex;
      gap: 0.4rem;
    }

    .city-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0.45rem 0.75rem;
      font-size: 0.8rem;
      color: var(--text-main);
      outline: none;
    }

    .city-input::placeholder {
      color: var(--text-muted);
    }

    .city-input:focus {
      border-color: var(--accent);
    }

    .city-save-btn {
      background: var(--accent);
      border: none;
      color: #0f172a;
      font-weight: 600;
      font-size: 0.75rem;
      padding: 0 0.8rem;
      border-radius: 10px;
      cursor: pointer;
    }

    .city-save-btn:hover {
      opacity: 0.9;
    }

    .weather-app-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .weather-city-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .weather-app-cond {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }

    .weather-hero-temp {
      text-align: right;
    }

    .weather-temp-main {
      font-size: 2.2rem;
      font-weight: 300;
      line-height: 1;
    }

    .weather-range-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .weather-stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 0.6rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .stat-box-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .stat-box-val {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .forecast-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: -0.3rem;
    }

    .weather-forecast-row {
      display: flex;
      justify-content: space-between;
      gap: 0.4rem;
      overflow-x: auto;
    }

    .forecast-day {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 0.5rem 0.3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      flex: 1;
      min-width: 48px;
    }

    .forecast-day-name {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .forecast-icon {
      font-size: 1rem;
    }

    .forecast-temp {
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* Animated Theme Switcher */
    .theme-switcher {
      position: relative;
    }

    .theme-btn {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.6rem 1.2rem;
      border-radius: 99px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .theme-menu {
      position: absolute;
      right: 0;
      top: 100%;
      padding-top: 10px;
      z-index: 20;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-12px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .theme-menu.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .theme-menu-inner {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      border-radius: 14px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .theme-opt {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .theme-opt:hover {
      background: var(--card-hover);
      color: var(--text-main);
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 0.25rem;
    }

    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      z-index: 1;
      animation: fadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .clock-container {
      text-align: center;
    }

    #time {
      font-size: 5.5rem;
      font-weight: 200;
      letter-spacing: -2px;
      line-height: 1;
      background: linear-gradient(180deg, var(--text-main), var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { filter: drop-shadow(0 0 5px rgba(255,255,255,0.1)); }
      to { filter: drop-shadow(0 0 25px var(--accent-glow)); }
    }

    #date {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    /* Search Bar & Engine Switcher */
    .search-container {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-form {
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1.5rem 1rem 4rem;
      font-size: 1rem;
      color: var(--text-main);
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      outline: none;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 30px var(--accent-glow);
      transform: scale(1.02);
      background: var(--card-hover);
    }

    .engine-switcher {
      position: absolute;
      left: 0.8rem;
      z-index: 5;
    }

    .engine-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.4rem;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .engine-btn:hover {
      transform: scale(1.2);
    }

    .engine-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    .engine-menu {
      position: absolute;
      left: 0;
      top: 100%;
      padding-top: 10px;
      z-index: 20;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-12px) scale(0.96);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .engine-menu.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .engine-menu-inner {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .engine-opt {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      text-align: left;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    .engine-opt:hover {
      background: var(--card-hover);
      color: var(--text-main);
    }

    /* Shortcuts Grid */
    .shortcuts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 1rem;
      width: 100%;
    }

    .shortcut-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 0.5rem;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      backdrop-filter: blur(12px);
      cursor: grab;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .shortcut-card:active {
      cursor: grabbing;
    }

    .shortcut-card.dragging {
      opacity: 0.4;
      transform: scale(0.95);
      border-style: dashed;
      border-color: var(--accent);
    }

    .shortcut-card:hover {
      background: var(--card-hover);
      transform: translateY(-6px) scale(1.05);
      border-color: var(--accent);
      box-shadow: 0 15px 30px -5px var(--accent-glow);
    }

    .shortcut-icon {
      width: 28px;
      height: 28px;
      margin-bottom: 0.5rem;
      fill: var(--accent);
      filter: drop-shadow(0 0 4px var(--accent-glow));
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .auto-svg-icon {
      background-color: var(--accent);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .shortcut-card:hover .shortcut-icon {
      transform: scale(1.2) rotate(6deg);
    }

    .shortcut-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .shortcut-card:hover .shortcut-label {
      color: var(--text-main);
    }

    .options-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-muted);
      border: none;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s ease;
      z-index: 5;
    }

    .shortcut-card:hover .options-btn {
      opacity: 1;
    }

    .options-btn:hover {
      background: var(--accent);
      color: #0f172a;
    }

    .action-menu {
      position: absolute;
      top: 32px;
      right: 6px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      border-radius: 10px;
      padding: 0.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.9);
      transition: all 0.2s ease;
    }

    .action-menu.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .action-opt {
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
    }

    .action-opt:hover {
      background: var(--card-hover);
    }

    .action-opt.delete:hover {
      background: rgba(239, 68, 68, 0.8);
      color: #fff;
    }

    .add-btn {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      cursor: pointer;
    }

    .add-btn:hover {
      border-style: solid;
      border-color: var(--accent);
    }

    .add-icon {
      font-size: 1.5rem;
      line-height: 26px;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    /* Modal Overlay & Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 2rem;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal input[type="text"],
    .modal input[type="url"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-main);
      outline: none;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .modal-btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .modal-btn.cancel { background: transparent; color: var(--text-muted); }
    .modal-btn.save { background: var(--accent); color: #0f172a; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="weather-container">
      <div class="weather-widget" id="weatherWidget">
        <span class="weather-icon" id="weatherIcon">⏳</span>
        <span id="weatherText">Locating...</span>
      </div>

      <div class="weather-card-menu" id="weatherCardMenu">
        <div class="weather-app-card">
          <form class="city-search-form" id="citySearchForm">
            <input type="text" id="customCityInput" class="city-input" placeholder="Enter city name..." autocomplete="off">
            <button type="submit" class="city-save-btn">Save</button>
          </form>

          <div class="weather-app-header">
            <div>
              <div class="weather-city-name" id="appCity">City Name</div>
              <div class="weather-app-cond" id="appCondition">Condition</div>
            </div>
            <div class="weather-hero-temp">
              <div class="weather-temp-main" id="appTemp">--°</div>
              <div class="weather-range-text" id="appRange">H: --° L: --°</div>
            </div>
          </div>

          <div class="weather-stats-grid">
            <div class="stat-box">
              <span class="stat-box-label">Wind</span>
              <span class="stat-box-val" id="appWind">-- km/h</span>
            </div>
            <div class="stat-box">
              <span class="stat-box-label">Humidity</span>
              <span class="stat-box-val" id="appHumidity">--%</span>
            </div>
            <div class="stat-box">
              <span class="stat-box-label">UV Index</span>
              <span class="stat-box-val" id="appUV">--</span>
            </div>
            <div class="stat-box">
              <span class="stat-box-label">Pressure</span>
              <span class="stat-box-val" id="appPressure">-- hPa</span>
            </div>
          </div>

          <span class="forecast-title">5-Day Forecast</span>
          <div class="weather-forecast-row" id="forecastRow">
            </div>
        </div>
      </div>
    </div>

    <div class="theme-switcher">
      <button class="theme-btn" id="themeToggleBtn" type="button">Theme</button>
      <div class="theme-menu" id="themeMenu">
        <div class="theme-menu-inner">
          <button class="theme-opt" type="button" onclick="setTheme('default')">Deep Space</button>
          <button class="theme-opt" type="button" onclick="setTheme('cyberpunk')">Cyberpunk</button>
          <button class="theme-opt" type="button" onclick="setTheme('emerald')">Emerald</button>
          <button class="theme-opt" type="button" onclick="setTheme('sunset')">Sunset Glow</button>
          <button class="theme-opt" type="button" onclick="setTheme('dracula')">Dracula</button>
          <button class="theme-opt" type="button" onclick="setTheme('light')">Clean Light</button>
          <div class="color-picker-wrapper">
            <span>Custom Color</span>
            <input type="color" id="customColorPicker" value="#38bdf8">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="clock-container">
      <div id="time">00:00</div>
      <div id="date">Loading date...</div>
    </div>

    <div class="search-container">
      <div class="engine-switcher">
        <button class="engine-btn" id="activeEngineBtn" type="button" title="Switch Search Engine">
          <svg id="activeEngineIcon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </button>
        <div class="engine-menu" id="engineMenu">
          <div class="engine-menu-inner">
            <button class="engine-opt" type="button" onclick="setSearchEngine('google')">Google</button>
            <button class="engine-opt" type="button" onclick="setSearchEngine('duckduckgo')">DuckDuckGo</button>
            <button class="engine-opt" type="button" onclick="setSearchEngine('bing')">Bing</button>
            <button class="engine-opt" type="button" onclick="setSearchEngine('brave')">Brave</button>
          </div>
        </div>
      </div>

      <form class="search-form" id="searchForm" action="https://www.google.com/search" method="GET">
        <input type="text" name="q" id="searchInput" class="search-input" placeholder="Search Google or type a URL..." autofocus autocomplete="off">
      </form>
    </div>

    <div class="shortcuts" id="shortcutGrid">
      <div class="shortcut-card add-btn" id="openModalBtn">
        <span class="add-icon">+</span>
        <span class="shortcut-label">Add New</span>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">Add New Shortcut</h3>
      <input type="text" id="shortcutTitle" placeholder="Name (e.g. GitHub)">
      <input type="url" id="shortcutUrl" placeholder="URL (e.g. https://github.com)">
      <div class="modal-buttons">
        <button class="modal-btn cancel" id="closeModalBtn">Cancel</button>
        <button class="modal-btn save" id="saveShortcutBtn">Save</button>
      </div>
    </div>
  </div>

  <script>
    const doraemonSvg = `<svg class="shortcut-icon" viewBox="0 0 87.3 78"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3L27.5 53H0c0 1.55.4 3.1 1.2 4.5zM43.65 25 29.9 1.2c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44A9.06 9.06 0 0 0 0 53h27.5zm29.9 51.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75L86.1 57.5c.8-1.4 1.2-2.95 1.2-4.5H59.798l5.852 11.5z"/><path d="M43.65 25 57.4 1.2C56.05.4 54.5 0 52.9 0H34.4c-1.6 0-3.15.45-4.5 1.2z" fill="rgba(0,0,0,0.2)"/><path d="M59.8 53H27.5L13.75 76.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2zm13.6-26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25 59.8 53h27.45c0-1.55-.4-3.1-1.2-4.5z"/></svg>`;

    const defaultShortcuts = [
      { id: 'def-doraemon1', title: 'Doraemon', url: 'https://lnk.ink/1S3Op', svg: doraemonSvg },
      { id: 'def-doraemon2', title: 'Doraemon 2', url: 'https://lnk.ink/tyVdX', svg: doraemonSvg }
    ];

    let editingShortcutId = null;

    /* Live Clock */
    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* Weather Codes */
    const weatherMap = {
      0: { text: 'Clear Sky', icon: '☀️' },
      1: { text: 'Mainly Clear', icon: '🌤️' },
      2: { text: 'Partly Cloudy', icon: '⛅' },
      3: { text: 'Overcast', icon: '☁️' },
      45: { text: 'Foggy', icon: '🌫️' },
      48: { text: 'Rime Fog', icon: '🌫️' },
      51: { text: 'Light Drizzle', icon: '🌦️' },
      53: { text: 'Moderate Drizzle', icon: '🌦️' },
      55: { text: 'Dense Drizzle', icon: '🌧️' },
      61: { text: 'Slight Rain', icon: '🌧️' },
      63: { text: 'Moderate Rain', icon: '🌧️' },
      65: { text: 'Heavy Rain', icon: '🌧️' },
      71: { text: 'Slight Snow', icon: '❄️' },
      73: { text: 'Moderate Snow', icon: '❄️' },
      75: { text: 'Heavy Snow', icon: '❄️' },
      80: { text: 'Rain Showers', icon: '🌦️' },
      81: { text: 'Moderate Showers', icon: '🌧️' },
      82: { text: 'Violent Showers', icon: '⛈️' },
      95: { text: 'Thunderstorm', icon: '🌩️' },
      96: { text: 'Thunderstorm with Hail', icon: '⛈️' },
      99: { text: 'Heavy Thunderstorm with Hail', icon: '⛈️' }
    };

    /* Reverse Geocoding City Finder */
    async function fetchCityName(lat, lon) {
      try {
        const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
        const data = await res.json();
        return data.city || data.locality || data.principalSubdivision || 'My Location';
      } catch (e) {
        return 'My Location';
      }
    }

    /* Direct City Name to Coordinates Search */
    async function fetchCoordsByCity(cityName) {
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const loc = data.results[0];
          return { lat: loc.latitude, lon: loc.longitude, name: loc.name };
        }
      } catch (e) {}
      return null;
    }

    /* Open-Meteo Real Weather Forecast Data API */
    async function fetchWeather(lat, lon, customName = null) {
      try {
        const cityName = customName || await fetchCityName(lat, lon);
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,surface_pressure,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`);

        const data = await weatherRes.json();
        const current = data.current;
        const daily = data.daily;
        const info = weatherMap[current.weather_code] || { text: 'Clear', icon: '☀️' };

        const temp = Math.round(current.temperature_2m);
        const maxTemp = Math.round(daily.temperature_2m_max[0]);
        const minTemp = Math.round(daily.temperature_2m_min[0]);

        // Main Widget Bar
        document.getElementById('weatherIcon').textContent = info.icon;
        document.getElementById('weatherText').textContent = `${cityName} ${temp}°C`;

        // Weather Card App Details
        document.getElementById('appCity').textContent = cityName;
        document.getElementById('appCondition').textContent = info.text;
        document.getElementById('appTemp').textContent = `${temp}°`;
        document.getElementById('appRange').textContent = `H: ${maxTemp}°  L: ${minTemp}°`;
        document.getElementById('appWind').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
        document.getElementById('appHumidity').textContent = `${current.relative_humidity_2m}%`;
        document.getElementById('appUV').textContent = Math.round(daily.uv_index_max[0]);
        document.getElementById('appPressure').textContent = `${Math.round(current.surface_pressure)} hPa`;

        // Build 5-Day Forecast Row
        const forecastRow = document.getElementById('forecastRow');
        forecastRow.innerHTML = '';

        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const todayIdx = new Date().getDay();

        for (let i = 0; i < 5; i++) {
          const dayName = i === 0 ? 'Today' : days[(todayIdx + i) % 7];
          const dayCode = daily.weather_code[i];
          const dayInfo = weatherMap[dayCode] || { icon: '🌤️' };
          const dayMax = Math.round(daily.temperature_2m_max[i]);

          const dayEl = document.createElement('div');
          dayEl.className = 'forecast-day';
          dayEl.innerHTML = `
            <span class="forecast-day-name">${dayName}</span>
            <span class="forecast-icon">${dayInfo.icon}</span>
            <span class="forecast-temp">${dayMax}°</span>
          `;
          forecastRow.appendChild(dayEl);
        }

      } catch (err) {
        document.getElementById('weatherText').textContent = 'Unavailable';
      }
    }

    /* Initialize Location based on Storage or Geolocation */
    async function initWeather() {
      const savedCity = localStorage.getItem('savedWeatherCity');
      if (savedCity) {
        const coords = await fetchCoordsByCity(savedCity);
        if (coords) {
          fetchWeather(coords.lat, coords.lon, coords.name);
          return;
        }
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
          () => fetchWeather(51.5074, -0.1278)
        );
      } else {
        fetchWeather(51.5074, -0.1278);
      }
    }
    initWeather();

    /* City Search & Save Form Handler */
    const citySearchForm = document.getElementById('citySearchForm');
    const customCityInput = document.getElementById('customCityInput');

    citySearchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const city = customCityInput.value.trim();
      if (city) {
        const coords = await fetchCoordsByCity(city);
        if (coords) {
          localStorage.setItem('savedWeatherCity', coords.name);
          fetchWeather(coords.lat, coords.lon, coords.name);
          customCityInput.value = '';
        } else {
          alert('City not found. Please try again.');
        }
      }
    });

    /* Search Form Submit: Open Direct URLs if user enters domain pattern */
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');

    searchForm.addEventListener('submit', (e) => {
      const query = searchInput.value.trim();
      const urlPattern = /^(https?:\/\/)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/.*)?$/i;

      if (urlPattern.test(query)) {
        e.preventDefault();
        let targetUrl = query;
        if (!/^https?:\/\//i.test(targetUrl)) {
          targetUrl = 'https://' + targetUrl;
        }
        window.location.href = targetUrl;
      }
    });

    /* Toggle Weather Card Modal */
    const weatherWidget = document.getElementById('weatherWidget');
    const weatherCardMenu = document.getElementById('weatherCardMenu');

    weatherWidget.addEventListener('click', (e) => {
      e.stopPropagation();
      engineMenu.classList.remove('active');
      themeMenu.classList.remove('active');
      weatherCardMenu.classList.toggle('active');
    });

    // Prevent modal close when clicking or selecting text inside the weather card
    weatherCardMenu.addEventListener('click', (e) => e.stopPropagation());
    weatherCardMenu.addEventListener('mouseup', (e) => e.stopPropagation());

    /* Search Engine Switcher Logic */
    const searchEngines = {
      google: { action: 'https://www.google.com/search', param: 'q', name: 'Google' },
      duckduckgo: { action: 'https://duckduckgo.com/', param: 'q', name: 'DuckDuckGo' },
      bing: { action: 'https://www.bing.com/search', param: 'q', name: 'Bing' },
      brave: { action: 'https://search.brave.com/search', param: 'q', name: 'Brave' }
    };

    const activeEngineBtn = document.getElementById('activeEngineBtn');
    const engineMenu = document.getElementById('engineMenu');

    activeEngineBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      themeMenu.classList.remove('active');
      weatherCardMenu.classList.remove('active');
      engineMenu.classList.toggle('active');
    });

    engineMenu.addEventListener('click', (e) => e.stopPropagation());

    function setSearchEngine(key) {
      const engine = searchEngines[key] || searchEngines.google;
      
      searchForm.action = engine.action;
      searchInput.name = engine.param;
      searchInput.placeholder = `Search ${engine.name} or type a URL...`;
      localStorage.setItem('selectedSearchEngine', key);
      
      engineMenu.classList.remove('active');
    }

    const savedEngine = localStorage.getItem('selectedSearchEngine');
    if (savedEngine) setSearchEngine(savedEngine);

    /* Theme Switcher Logic */
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeMenu = document.getElementById('themeMenu');

    themeToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      engineMenu.classList.remove('active');
      weatherCardMenu.classList.remove('active');
      themeMenu.classList.toggle('active');
    });

    themeMenu.addEventListener('click', (e) => e.stopPropagation());

    function hexToHSL(hex) {
      let r = parseInt(hex.slice(1, 3), 16) / 255;
      let g = parseInt(hex.slice(3, 5), 16) / 255;
      let b = parseInt(hex.slice(5, 7), 16) / 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;
      if (max !== min) {
        let d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function applyCustomTheme(hexColor) {
      const { h, s } = hexToHSL(hexColor);
      const bg = `linear-gradient(-45deg, hsl(${h}, ${Math.min(s, 60)}%, 8%), hsl(${(h + 40) % 360}, ${Math.min(s, 70)}%, 12%), hsl(${(h + 80) % 360}, ${Math.min(s, 80)}%, 15%), hsl(${(h + 120) % 360}, ${Math.min(s, 50)}%, 5%))`;
      document.documentElement.style.setProperty('--bg-gradient', bg);
      document.documentElement.style.setProperty('--card-bg', `hsla(${h}, ${s}%, 18%, 0.6)`);
      document.documentElement.style.setProperty('--card-hover', `hsla(${h}, ${s}%, 28%, 0.8)`);
      document.documentElement.style.setProperty('--accent', `hsl(${h}, 90%, 65%)`);
      document.documentElement.style.setProperty('--accent-glow', `hsla(${h}, 90%, 65%, 0.45)`);
      document.documentElement.setAttribute('data-theme', 'custom');
      localStorage.setItem('selectedTheme', 'custom');
      localStorage.setItem('customColor', hexColor);
    }

    function clearCustomInlineStyles() {
      ['--bg-gradient','--card-bg','--card-hover','--accent','--accent-glow'].forEach(prop => document.documentElement.style.removeProperty(prop));
    }

    function setTheme(theme) {
      clearCustomInlineStyles();
      if (theme === 'default') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.removeItem('selectedTheme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('selectedTheme', theme);
      }
      themeMenu.classList.remove('active');
    }

    const colorPicker = document.getElementById('customColorPicker');
    colorPicker.addEventListener('input', (e) => applyCustomTheme(e.target.value));

    const savedTheme = localStorage.getItem('selectedTheme');
    const savedColor = localStorage.getItem('customColor');
    if (savedTheme === 'custom' && savedColor) {
      colorPicker.value = savedColor;
      applyCustomTheme(savedColor);
    } else if (savedTheme) {
      setTheme(savedTheme);
    }

    /* Global Dismiss Click Listener */
    document.addEventListener('click', () => {
      engineMenu.classList.remove('active');
      themeMenu.classList.remove('active');
      weatherCardMenu.classList.remove('active');
      document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));
    });

    /* Shortcuts Logic */
    function getAutomaticIconUrl(url) {
      try {
        let domain = new URL(url).hostname.replace('www.', '');
        let name = domain.split('.')[0].toLowerCase();
        if (name === 'x') name = 'twitter';
        return `https://cdn.jsdelivr.net/npm/simple-icons@v10/icons/${name}.svg`;
      } catch (e) {
        return `https://www.google.com/s2/favicons?domain=${url}&sz=128`;
      }
    }

    function getStoredShortcuts() {
      const stored = localStorage.getItem('allShortcuts_v6');
      if (!stored) {
        localStorage.setItem('allShortcuts_v6', JSON.stringify(defaultShortcuts));
        return defaultShortcuts;
      }
      return JSON.parse(stored);
    }

    function saveShortcutsToStorage(shortcuts) {
      localStorage.setItem('allShortcuts_v6', JSON.stringify(shortcuts));
    }

    function renderShortcut(item) {
      let iconHTML = '';
      if (item.svg) {
        iconHTML = item.svg;
      } else {
        const svgUrl = getAutomaticIconUrl(item.url);
        let domain = item.url;
        try { domain = new URL(item.url).hostname; } catch(e){}
        const fallbackFavicon = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

        iconHTML = `
          <div class="shortcut-icon auto-svg-icon" style="-webkit-mask-image: url('${svgUrl}'); mask-image: url('${svgUrl}');">
            <img src="${svgUrl}" style="display:none;" onerror="
              const parent = this.parentElement;
              parent.classList.remove('auto-svg-icon');
              parent.style.mask = 'none';
              parent.style.webkitMask = 'none';
              parent.style.backgroundColor = 'transparent';
              parent.innerHTML = '<img class=\\'shortcut-icon\\' src=\\'${fallbackFavicon}\\'>';
            ">
          </div>
        `;
      }

      const card = document.createElement('a');
      card.href = item.url;
      card.className = 'shortcut-card';
      card.dataset.id = item.id;
      card.draggable = true;

      card.innerHTML = `
        <button class="options-btn" title="Options" type="button">⋮</button>
        <div class="action-menu">
          <button class="action-opt edit" type="button">Edit</button>
          <button class="action-opt delete" type="button">Delete</button>
        </div>
        ${iconHTML}
        <span class="shortcut-label">${item.title}</span>
      `;

      const optionsBtn = card.querySelector('.options-btn');
      const actionMenu = card.querySelector('.action-menu');

      optionsBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        document.querySelectorAll('.action-menu').forEach(m => m !== actionMenu && m.classList.remove('active'));
        actionMenu.classList.toggle('active');
      });

      card.querySelector('.action-opt.edit').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        actionMenu.classList.remove('active');
        openEditModal(item);
      });

      card.querySelector('.action-opt.delete').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        let shortcuts = getStoredShortcuts().filter(s => s.id !== item.id);
        saveShortcutsToStorage(shortcuts);
        card.remove();
      });

      card.addEventListener('dragstart', (e) => {
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', item.id);
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        saveCurrentGridOrder();
      });

      shortcutGrid.insertBefore(card, openModalBtn);
    }

    /* Drag & Drop Reordering */
    shortcutGrid.addEventListener('dragover', (e) => {
      e.preventDefault();
      const draggingCard = document.querySelector('.shortcut-card.dragging');
      if (!draggingCard) return;

      const cards = [...shortcutGrid.querySelectorAll('.shortcut-card:not(.dragging):not(.add-btn)')];
      const nextCard = cards.find(c => {
        const box = c.getBoundingClientRect();
        return e.clientX < box.left + box.width / 2 && e.clientY < box.top + box.height / 2;
      });

      if (nextCard) {
        shortcutGrid.insertBefore(draggingCard, nextCard);
      } else {
        shortcutGrid.insertBefore(draggingCard, openModalBtn);
      }
    });

    function saveCurrentGridOrder() {
      const cards = [...shortcutGrid.querySelectorAll('.shortcut-card:not(.add-btn)')];
      const allShortcuts = getStoredShortcuts();
      const reordered = cards.map(c => allShortcuts.find(s => s.id === c.dataset.id)).filter(Boolean);
      saveShortcutsToStorage(reordered);
    }

    /* Modal Operations */
    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveShortcutBtn = document.getElementById('saveShortcutBtn');

    openModalBtn.addEventListener('click', () => {
      editingShortcutId = null;
      document.getElementById('modalTitle').textContent = 'Add New Shortcut';
      document.getElementById('shortcutTitle').value = '';
      document.getElementById('shortcutUrl').value = '';
      modalOverlay.classList.add('active');
    });

    function openEditModal(item) {
      editingShortcutId = item.id;
      document.getElementById('modalTitle').textContent = 'Edit Shortcut';
      document.getElementById('shortcutTitle').value = item.title;
      document.getElementById('shortcutUrl').value = item.url;
      modalOverlay.classList.add('active');
    }

    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));

    saveShortcutBtn.addEventListener('click', () => {
      const title = document.getElementById('shortcutTitle').value.trim();
      let url = document.getElementById('shortcutUrl').value.trim();

      if (title && url) {
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }

        let shortcuts = getStoredShortcuts();

        if (editingShortcutId) {
          shortcuts = shortcuts.map(s => s.id === editingShortcutId ? { ...s, title, url } : s);
          saveShortcutsToStorage(shortcuts);
          loadAllShortcuts();
        } else {
          const newShortcut = { id: 'cust-' + Date.now(), title, url };
          shortcuts.push(newShortcut);
          saveShortcutsToStorage(shortcuts);
          renderShortcut(newShortcut);
        }

        modalOverlay.classList.remove('active');
      }
    });

    function loadAllShortcuts() {
      const existingCards = shortcutGrid.querySelectorAll('.shortcut-card:not(.add-btn)');
      existingCards.forEach(c => c.remove());
      getStoredShortcuts().forEach(item => renderShortcut(item));
    }

    loadAllShortcuts();
  </script>
</body>
